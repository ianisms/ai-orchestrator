# Speaker client configuration (hot-reloaded)
server_target: "ai-server.local:7000"
session_id_base: "speaker-1"
locale: "en-US"
request_partials: true
benchmark_profile: "balanced" # latency | balanced | robust | custom
benchmark_profiles_path: "/ai/speaker/config/benchmarks.yaml"

prefer_native_alsa: true
mic_device: "hw:Array,0"
mic_sample_rate_hz: 16000
mic_frame_ms: 20
mic_latency_msec: 30
mic_channels: 2
audio_driver: "alsa" # pulse | alsa
playback_device: "plughw:Speaker,0"
playback_channels: 1
alsa_period_time_us: 20000
alsa_buffer_time_us: 80000
wake_preroll_ms: 400

wake_model_path: "hey_jarvis"
wake_threshold: 0.55
wake_refractory_ms: 1200
wake_score_log_every_n: 50
wake_infer_chunk_ms: 80

min_commit_speech_ms: 200
min_capture_ms: 600             # minimum utterance duration (ms) before VAD silence can end capture

barge_in_enable: true
barge_in_min_speech_frames: 4   # 4 * 20ms = 80ms of sustained speech to interrupt
barge_in_prebuffer_ms: 200      # frames saved before trigger, passed to new turn as context
barge_in_settle_ms: 600         # ignore mic for first N ms of playback (chime bleed-through guard)

conversation_id_state_path: "/ai/speaker/state/conversation_id.txt"

followup_enable: false
followup_max: 10 # set to -1 for unlimited follow-ups
followup_idle_ms: 2000
followup_min_consecutive_speech_frames: 2
followup_prebuffer_ms: 200
drain_max_frames: 8

wake_chime_enable: true
wake_chime_freq_hz: 880
wake_chime_ms: 140

vad_rms_threshold: 165.0
vad_silence_hangover_ms: 450
vad_max_utterance_ms: 12000
vad_adaptive_enable: true
vad_adaptive_floor: 90.0        # minimum threshold (quiet room baseline)
vad_adaptive_ceiling: 420.0     # normal ceiling: cap when noise_floor < vad_adaptive_high_noise_threshold
vad_adaptive_ceiling_high: 900.0  # noisy-environment ceiling: used when noise_floor >= threshold below
                                  # raise if speech is missed in loud rooms (check logs for noise_floor)
vad_adaptive_high_noise_threshold: 260.0  # noise_floor RMS above which ceiling_high takes over
vad_adaptive_margin: 1.8        # threshold = noise_floor * margin (clamped to floor/ceiling)
vad_noise_ema_alpha: 0.03       # EMA smoothing for noise floor (higher = adapts faster to noise changes)
vad_calibration_path: "/ai/speaker/state/vad_calibration.json"
playback_guard_ms: 300
capture_skip_playback_ms: 1200
settle_silence_ms: 400  # fallback for benchmark_profile: custom; overridden by profiles otherwise
settle_max_ms: 2000     # hard deadline for the post-playback silence-wait (abandon if no quiet found)
playback_backpressure_high_watermark: 384
playback_backpressure_drop_nonfinal: true
echo_suppress_enable: false
echo_suppress_max_attenuation: 0.35

health_path: "/tmp/speaker_health.json"
health_check_interval_s: 10.0   # seconds between server reachability probes
health_check_timeout_s: 3.0     # channel_ready() timeout per probe
log_level: "INFO"
verbose: false
stream_log_every_n: 50
audio_cpu_affinity: ""
audio_nice: 0
audio_rt_priority: 0

# Force end-of-utterance if we've been sending audio this long (ms)
stt_send_timeout_ms: 0
stop_capture_on_first_tts_audio: true
# Stop sending mic audio as soon as server signals it's done with STT (THINKING state)
stop_on_thinking: true
# gRPC keepalive: tight values for local LAN (faster disconnect detection)
grpc_keepalive_time_ms: 5000
grpc_keepalive_timeout_ms: 3000
grpc_connect_max_attempts: 8        # retries before giving up on initial connect
grpc_connect_ready_timeout_ms: 4000 # channel_ready() timeout per attempt (raise if server loads slowly)
